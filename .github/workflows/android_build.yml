# GitHub Actions Workflow for Building Hybrid Termux APK (Robust Packaging)
name: Android APK Build (Robust Packaging)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: ၁။ ကုဒ်များကို ရယူခြင်း (Checkout Code)
        uses: actions/checkout@v4

      - name: ၂။ Android SDK Tools နှင့် JDK ကို ထည့်သွင်းခြင်း
        # JDK 17 ကို Install လုပ်ခြင်း
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
        
      - name: ၃။ Android Build Essentials (AAPT, Zipalign) ထည့်သွင်းခြင်း
        run: |
          # Build-tools (aapt, zipalign) ကို apt မှတဆင့် ထည့်သွင်းပြီး PATH သို့ ထည့်သွင်းခြင်း
          sudo apt update
          # android-sdk သည် aapt, zipalign များပါသော build-tools ကို ပံ့ပိုးပေးသည်
          sudo apt install -y android-sdk zip nodejs npm

          # Build Script ကို Execute လုပ်ရန် ခွင့်ပြုချက် ပေးခြင်း (YAML syntax error fix)
          chmod +x build_apk.sh
          
      - name: ၄။ Self-Contained Script ဖြင့် APK ဖိုင်ကို တည်ဆောက်ခြင်း
        run: ./build_apk.sh
          
      - name: ၅။ APK ဖိုင်ကို Artifact အဖြစ် သိမ်းဆည်းခြင်း
        uses: actions/upload-artifact@v4
        with:
          name: ocr-scanner-csv-apk
          path: ./OcrScannerCSV.apk
          retention-days: 7
