name: Android APK Build (Final SDK Setup Fix)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: ၁။ ကုဒ်များကို ရယူခြင်း (Checkout Code)
        uses: actions/checkout@v4

      - name: ၂။ Java 17 (JDK) ကို ထည့်သွင်းခြင်း
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ၃။ Android SDK (API 34) ကို ထည့်သွင်းခြင်း
  uses: android-actions/setup-android@v3
  with:
    accept-android-sdk-licenses: true
    packages: |
      platform-tools
      build-tools;34.0.0
      platforms;android-34

      - name: ၄။ Build Essentials (Zip, Node) နှင့် Script ခွင့်ပြုချက် ပေးခြင်း
        run: |
          sudo apt update
          sudo apt install -y nodejs npm zip

          chmod +x build_apk.sh

      - name: ၅။ Self-Contained Script ဖြင့် APK ဖိုင်ကို တည်ဆောက်ခြင်း
        run: ./build_apk.sh

      - name: ၆။ APK ဖိုင်ကို Artifact အဖြစ် သိမ်းဆည်းခြင်း
        uses: actions/upload-artifact@v4
        with:
          name: ocr-scanner-csv-apk
          path: ./OcrScannerCSV.apk
          retention-days: 7
